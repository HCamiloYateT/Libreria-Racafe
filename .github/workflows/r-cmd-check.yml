name: R CMD check (subpackages)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - racafeCore
          - racafeBD
          - racafeDrive
          - racafeGraph
          - racafeForecast
          - racafeShiny
          - racafeForms
          - racafeMail

    steps:
      - uses: actions/checkout@v4

      - name: Checkout versioned email templates
        if: matrix.package == 'racafeMail'
        uses: actions/checkout@v4
        with:
          repository: HCamiloYateT/Compartido
          ref: d47401b5e1ae2292577dcda05def43ee051aa9f0
          path: .racafe-mail-shared
          token: ${{ secrets.COMPARTIDO_READ_TOKEN || github.token }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::rcmdcheck
            any::remotes
          needs: check

      - name: Install local Racafe dependencies
        run: |
          Rscript -e 'remotes::install_local(c("racafeCore", "racafeGraph", "racafeBD", "racafeDrive", "racafeForecast", "racafeShiny", "racafeForms", "racafeMail"), dependencies = TRUE, upgrade = "never", force = TRUE)'

      - name: Run R CMD check
        env:
          RACAFE_MAIL_TEST_HOME: ${{ github.workspace }}/.racafe-mail-shared/email
        run: |
          Rscript -e "rcmdcheck::rcmdcheck('${{ matrix.package }}', args = c('--no-manual', '--as-cran'), error_on = 'warning')"
